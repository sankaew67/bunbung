<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="none" stroke="#8A5A36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".16">

    <!-- cupcake -->
    <g transform="translate(35 40) rotate(-8)">
      <path d="M0 26h34l-4 16a4 4 0 0 1-4 3H8a4 4 0 0 1-4-3L0 26Z"/>
      <path d="M-3 26c0-9 8-14 20-14s20 5 20 14"/>
      <path d="M4 14c1-3 3-3 3-6M12 14c1-3 3-3 3-6M20 14c1-3 3-3 3-6"/>
    </g>

    <!-- slice of cake -->
    <g transform="translate(230 20) rotate(6)">
      <path d="M0 34 20 4l20 30Z"/>
      <path d="M4 27h32M8 19h24"/>
      <circle cx="20" cy="2" r="2.4"/>
    </g>

    <!-- tea cup -->
    <g transform="translate(150 90) rotate(-4)">
      <path d="M0 8h26v9a13 13 0 0 1-13 13A13 13 0 0 1 0 17V8Z"/>
      <path d="M26 11h3.5a4.5 4.5 0 0 1 0 9H26"/>
      <ellipse cx="13" cy="8" rx="13" ry="2.6"/>
    </g>

    <!-- cookie -->
    <g transform="translate(300 150) rotate(10)">
      <circle cx="15" cy="15" r="15"/>
      <circle cx="10" cy="11" r="1.6" fill="#8A5A36" stroke="none"/>
      <circle cx="20" cy="10" r="1.6" fill="#8A5A36" stroke="none"/>
      <circle cx="20" cy="19" r="1.6" fill="#8A5A36" stroke="none"/>
      <circle cx="10" cy="19" r="1.6" fill="#8A5A36" stroke="none"/>
    </g>

    <!-- heart -->
    <g transform="translate(55 170) rotate(-6)">
      <path d="M12 22C-4 12 0-2 12 4 24-2 28 12 12 22Z"/>
    </g>

    <!-- macaron -->
    <g transform="translate(190 200) rotate(4)">
      <ellipse cx="16" cy="8" rx="16" ry="7"/>
      <rect x="4" y="12" width="24" height="6" rx="3"/>
      <ellipse cx="16" cy="24" rx="16" ry="7"/>
    </g>

    <!-- flower -->
    <g transform="translate(300 260) rotate(0)">
      <circle cx="10" cy="0" r="6"/><circle cx="-10" cy="0" r="6"/>
      <circle cx="0" cy="10" r="6"/><circle cx="0" cy="-10" r="6"/>
      <circle cx="0" cy="0" r="4" fill="#8A5A36" stroke="none"/>
    </g>

    <!-- mug -->
    <g transform="translate(30 270) rotate(-10)">
      <path d="M0 6h22v14a7 7 0 0 1-7 7H7a7 7 0 0 1-7-7V6Z"/>
      <path d="M22 10h3a4 4 0 0 1 0 8h-3"/>
    </g>

    <!-- sparkle -->
    <g transform="translate(120 300)">
      <path d="M10 0 12 8 20 10 12 12 10 20 8 12 0 10 8 8Z"/>
    </g>

    <!-- donut -->
    <g transform="translate(250 330) rotate(6)">
      <circle cx="17" cy="17" r="17"/>
      <circle cx="17" cy="17" r="6"/>
    </g>

    <!-- small dot trio -->
    <g fill="#8A5A36" stroke="none">
      <circle cx="110" cy="55" r="2.6"/>
      <circle cx="345" cy="60" r="2.6"/>
      <circle cx="90" cy="245" r="2.6"/>
      <circle cx="355" cy="220" r="2.6"/>
      <circle cx="200" cy="355" r="2.6"/>
    </g>

  </g>
</svg>
